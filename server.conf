# WireGuard Dynamic Server Configuration File

# WireGuardインターフェイス名
interface=wg0

# サーバーのIPアドレス（CIDR表記）
# このIPアドレスがWireGuardインターフェイスに設定されます
server_ip=10.0.0.1/24

# WireGuardのリスニングポート
# VPN通信に使用されるポート
wg_listen_port=51820

# 設定サーバーのポート
# クライアントが設定を取得するために接続するポート
config_server_port=51821

# クライアントに割り当てるIPアドレスプール（CIDR表記）
# この範囲内からクライアントにIPアドレスが動的に割り当てられます
# サーバーIPと重複しても自動的にスキップされます
client_ip_pool=10.0.0.0/24

# クライアントに渡すAllowedIPs
# クライアント側のWireGuard設定で使用されます
# この範囲の通信がWireGuard経由でルーティングされます
allowed_ips=10.0.0.0/24

# サーバーのWireGuard秘密鍵
# 設定されていない場合は自動で生成されます
server_privkey=
